<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Document</title>
	<link rel="stylesheet" href="node_modules/bootstrap/dist/css/bootstrap.min.css">
	<link rel="stylesheet" href="main.css">
	<script type="module" src="node_modules/bootstrap/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
	<header class="py-3 mb-3 border-bottom bg-primary-subtle container-fluid">
		<div class="container-fluid d-grid gap-3 align-items-center" style="grid-template-columns: 1fr 2fr;">
			<div class="dropdown">
				<a href="#" class="d-flex align-items-center col-lg-4 mb-2 mb-lg-0 link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">Set Theory</a>
				<ul class="dropdown-menu text-small shadow">
					<li>
						<a href="#" class="dropdown-item active">Intro to sets</a>
					</li>
					<li>
						<a href="#" class="dropdown-item disabled">TBA</a>
					</li>
					<li>
						<a href="#" class="dropdown-item  disabled">TBA</a>
					</li>

					</ul>
				</div>
				<div class="d-flex align-items-center">
					<form role="search" class="w-100 me-3">
						<input type="search" class="form-control bg-light-subtle" placeholder="Search...">
					</form>
					<div class="dropdown">
						<a href="#" class="d-block link-body-emphasis text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">Menu</a>
						<ul class="dropdown-menu text-small shadow">
							<li >
								<button type="button" class="dropdown-item btn btn-secondary disabled">Clear	</button>
								<button type="button" class="dropdown-item btn btn-secondary disabled">Export</button>
							</li>
						</ul>
					</div>
				</div>
		</div>
	</header>

	<!-- HEADER -->
	<main class="border rounded ms-4 me-5 bg-secondary" >

	<div id="control" class="w-100 container-fluid">

		<div id="Add" class="container-fluid p-3 ms-1">
			<h2>Add Set:</h2>
			<div class="row g-2 align-items-center">
				<div class="col-2">
					<input class="form-control" type="text" placeholder="Name...">
				</div>
				<div class="col-7">
					<input class="form-control" type="text" placeholder="Comma separated values...">
				</div>
				<div class="col-3">
					<button type="button" class="btn btn-primary">Add</button>
				</div>
			</div>
		</div>
		

		<!-- TEMPLATE -->
		<div id="sets" class="container-fluid p-3 ms-1">
			
			<h3>Defined Sets:</h3>
			<!-- dynamic  -->
			<div class="row g-2 align-items-center mb-1">
				<div class="col-2">
					<input class="form-control" name="setName1" type="text" placeholder="Name..." value="A">
				</div>
				<div class="col-7">
					<input 
						class="form-control" 
						name="setElements1" 
						type="text" 
						placeholder="Insert comma separated..."
						value="A, B, 1, 2"
					>
				</div>
				<div class="col-3">
					<button type="button" class="btn btn-danger">Delete</button>
				</div>
			</div>
			
			<div class="row g-2 align-items-center mb-1">
				<div class="col-2">
					<input class="form-control" name="setName1" type="text" placeholder="Name..." value="B">
				</div>
				<div class="col-7">
					<input 
						class="col-7 form-control" 
						name="setElements1" 
						type="text" 
						placeholder="Insert comma separated..."
						value="A, B, 1, 2"
					>
				</div>
				<div class="col-3">
					<button type="button" class="btn btn-danger">Delete</button>
				</div>
			</div>
		</div>
		<div id="operation" class="container-fluid p-3 ms-1">
			<h3>Operations:</h3>

			<div class="row g-2 align-items-center">
				<div class="col-3 d-grid">
					<button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">Difference</button>
					<ul class="dropdown-menu">
						<li><button type="button" class="btn btn-secondary dropdown-item active">Difference</button></li>
						<li><button type="button" class="btn btn-secondary dropdown-item">Union</button></li>
						<li><button type="button" class="btn btn-secondary dropdown-item">Intersection</button></li>
						<li><button type="button" class="btn btn-secondary dropdown-item">Compliment</button></li>
					</ul>
				</div>

				<div class="col-3 d-grid">
					<button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">A</button>
					<ul class="dropdown-menu">
						<!-- dynamic data -->
						<li><button type="button" class="btn btn-primary dropdown-item active">A</button></li>
						<li><button type="button" class="btn btn-primary dropdown-item">B</button></li>
					</ul>
				</div>

				<div class="col-3 d-grid">
					<button type="button" class="btn btn-primary dropdown-toggle" data-bs-toggle="dropdown">B</button>
					<ul class="dropdown-menu">
						<!-- dynamic data -->
						<li><button type="button" class="btn btn-primary dropdown-item">A</button></li>
						<li><button type="button" class="btn btn-primary dropdown-item active">B</button></li>
					</ul>
					</div>					
				</div>

			</div>
		</div>

		<div id="results" class="mx-1 mb-3 p-2 bg-dark rounded text-muted">
			Result will appear here
		</div>
	</main>
</body>
</html>
